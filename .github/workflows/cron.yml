name: stock-alert

on:
  schedule:
    - cron: "*/5 0-14 * * 1-5" # UTC 0-14 = JST 9-23（平日）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Ensure state file exists
        run: |
          if [ ! -f state.json ]; then echo "{}" > state.json; fi

      - name: Run watcher
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          TEST_LINE: "1"
        run: python watcher.py
