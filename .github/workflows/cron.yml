name: stock-alert

on:
  schedule:
    - cron: "*/5 0-14 * * 1-5" # UTC 0-14 = JST 9-23（平日）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # state.json を前回から復元
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_number }}
          restore-keys: |
            state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure state file exists
        run: |
          if [ ! -f state.json ]; then echo "{}" > state.json; fi

      - name: Run watcher
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # 最初の動作確認中だけ 1 にする（確認できたら削除 or "0"）
          TEST_LINE: "0"
        run: python watcher.py

      # state.json を保存
      - name: Save state cache
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_number }}
